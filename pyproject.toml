[project]
name = "jarvis-ai"
version = "0.1.0"
description = "Local-first Windows personal assistant"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
